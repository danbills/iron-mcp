name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Scala Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev libgc-dev libre2-dev
      - name: Test on the JVM
        run: sbt "coreJVM/Test/testFull"
      - name: Compile and link for Scala Native
        run: sbt "coreNative/Test/compile" "demoNative/nativeLink"

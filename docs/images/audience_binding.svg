<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="519px" preserveAspectRatio="none" style="width:2159px;height:519px;background:#FFFFFF;" version="1.1" viewBox="0 0 2159 519" width="2159px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><rect fill="#FFFFCC" height="16.6406" rx="2.5" ry="2.5" style="stroke:#FFDD88;stroke-width:3;" width="2143.9619" x="3" y="8"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="361.2305" x="10" y="18.6406">Please&#160;use&#160;CSS&#160;style&#160;instead&#160;of&#160;skinparam&#160;ParticipantPadding</text><rect fill="#F8F9FA" height="484.6875" style="stroke:#181818;stroke-width:0.5;" width="284.2744" x="1376.3726" y="27.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="247.8252" x="1394.5972" y="39.7075">iron-mcp Resource Server (:5309)</text><rect fill="#E8F4F8" height="484.6875" style="stroke:#181818;stroke-width:0.5;" width="188.6465" x="1954.3154" y="27.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="152.5977" x="1972.3398" y="39.7075">Authorization Server</text><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="Client" data-source-line="7" id="part1-lifeline"><g><title>Client . Attacker</title><rect fill="#000000" fill-opacity="0.00000" height="415.3906" width="8" x="72.728" y="102.9375"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="76" x2="76" y1="102.9375" y2="518.3281"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="RS" data-source-line="9" id="part2-lifeline"><g><title>McpAuthServer</title><rect fill="#000000" fill-opacity="0.00000" height="415.3906" width="8" x="1514.5098" y="102.9375"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="1518.3726" x2="1518.3726" y1="102.9375" y2="518.3281"/></g></g><g class="participant-lifeline" data-entity-uid="part3" data-qualified-name="AS" data-source-line="12" id="part3-lifeline"><g><title>Keycloak AS</title><rect fill="#000000" fill-opacity="0.00000" height="415.3906" width="8" x="2044.6387" y="102.9375"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="2048.3154" x2="2048.3154" y1="102.9375" y2="518.3281"/></g></g><g class="participant participant-head" data-entity-uid="part1" data-qualified-name="Client" data-source-line="7" id="part1-head"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.4561" x="17" y="99.6357">Client / Attacker</text><ellipse cx="76.728" cy="35.1406" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M76.728,43.1406 L76.728,70.1406 M63.728,51.1406 L89.728,51.1406 M76.728,70.1406 L63.728,85.1406 M76.728,70.1406 L89.728,85.1406" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-head" data-entity-uid="part2" data-qualified-name="RS" data-source-line="9" id="part2-head"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="276.2744" x="1380.3726" y="55.3438"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.3857" x="1464.8169" y="75.3389">McpAuthServer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.2744" x="1387.3726" y="91.6357">(resource: http://localhost:5309/mcp)</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="AS" data-source-line="12" id="part3-head"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.6465" x="1958.3154" y="55.3438"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.832" x="2005.7227" y="75.3389">Keycloak AS</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.6465" x="1965.3154" y="91.6357">(issues genuine tokens)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="2153.9619" x="0" y="133.5039"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2153.9619" y1="133.5039" y2="133.5039"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="2153.9619" y1="136.5039" y2="136.5039"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="526.1162" x="813.9229" y="122.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="507.5903" x="819.9229" y="139.0044">RFC 8707 Audience Check &#8212; Defeating the Downstream Trap (&#167;9.2.4)</text><path d="M5,161.0703 L5,216.0703 L2121,216.0703 L2121,171.0703 L2111,161.0703 L5,161.0703" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2111,161.0703 L2111,171.0703 L2121,171.0703 L2111,161.0703" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="483.4756" x="817.2432" y="178.1372">Client obtains a genuine token minted for a different downstream service:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="463.8486" x="817.2432" y="193.27">Token claims: { iss: "...", aud: ["https://other-service.internal/api"], ... }</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.6362" x="817.2432" y="208.4028">The cryptographic signature by Keycloak is 100% genuine!</text><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="22" id="msg1"><polygon fill="#181818" points="1506.5098,284,1516.5098,288,1506.5098,292" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="76.728" x2="1512.5098" y1="288" y2="288"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="9.0454" x="644.8621" y="260.2349">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8398" x="768.7217" y="237.5356">POST /mcp</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4683" x="657.9075" y="252.6685">Authorization: Bearer &lt;other-service-token&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6816" x="730.8008" y="267.8013">Mcp-Method: tools/call</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5762" x="716.3535" y="282.9341">Mcp-Name: read_summary</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="24" id="msg2"><line style="stroke:#181818;stroke-width:1;" x1="1518.5098" x2="1560.5098" y1="347.3984" y2="347.3984"/><line style="stroke:#181818;stroke-width:1;" x1="1560.5098" x2="1560.5098" y1="347.3984" y2="360.3984"/><line style="stroke:#181818;stroke-width:1;" x1="1519.5098" x2="1560.5098" y1="360.3984" y2="360.3984"/><polygon fill="#181818" points="1529.5098,356.3984,1519.5098,360.3984,1529.5098,364.3984" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="9.0454" x="1525.5098" y="327.1997">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="418.063" x="1581.0654" y="312.0669">1. Verify RS256 signature against Keycloak JWKS: OK (genuine!)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8374" x="1684.6782" y="327.1997">2. Check expiration &amp; issuer: OK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="503.0835" x="1538.5552" y="342.3325">3. Check RFC 8707 audience claim: aud=["https://other-service.internal/api"]</text></g><path d="M1273,373.3984 L1273,428.3984 L1763,428.3984 L1763,383.3984 L1753,373.3984 L1273,373.3984" fill="#FFEAEA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1753,373.3984 L1753,383.3984 L1763,383.3984 L1753,373.3984" fill="#FFEAEA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.0308" x="1279" y="390.4653">AUDIENCE MISMATCH!</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.7466" x="1279" y="405.5981">The token is genuine, but was minted for another resource.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.6758" x="1279" y="420.731">Accepting this would allow downstream services to impersonate callers.</text><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="31" id="msg3"><polygon fill="#181818" points="87.728,496.3281,77.728,500.3281,87.728,504.3281" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="81.728" x2="1517.5098" y1="500.3281" y2="500.3281"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="9.0454" x="88.728" y="472.563">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.2256" x="746.0288" y="449.8638">401 Unauthorized</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.3643" x="639.9595" y="464.9966">WWW-Authenticate: Bearer error="invalid_token",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9448" x="110.0381" y="480.1294">error_description="Token audience is 'https:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="760.0811" x="400.9829" y="480.1294">other-service.internal/api' &#8212; this is a token for a different resource. This server only accepts tokens minted for 'http:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.4458" x="1161.064" y="480.1294">localhost:5309/mcp' (RFC 8707 resource indicator).",</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="570.0894" x="523.2292" y="495.2622">resource_metadata="http://localhost:5309/.well-known/oauth-protected-resource/mcp"</text></g><?plantuml-src ZLJhRjCm5FwVfpW4mLgfIRknmHPHfD2r0gO2MWVxGT7aEgUjrSGEjaCf28c7u1ru3nw59-4ubwxZ8iYFI8vzpdU-YyCAgsIHpL1xPYLapZJBmDXDYlJMWjiYItTty5s1akCOZM4BZ5EnaC1HsXlrC_NX9KiI8HUmtzlvJcyhkCYPjDlz8yzZt2eD_Y0Lr0Yw45lB-0gr3yn0zTMZbk0BhMIGyHpEqQX2SuG9wlUeeHKTtUkTj7suFJeUdOnY3-ZPGGD_pFEuiClg_5IsTDqXWgMrUTJjfegpTAcCBLjr2QLTufzFF9I9erJDuBeeBJuoAvIiyGbtU3mw71t_Zdk66vugje9uGgZ2c08DB50MGY9OjK9fAfpu6iVhz-5yD83Z1xq741U9S8h3O8by1J--V8LJd2F1atfsYN2grfAiGjBtGhCSMj-_dOG7uM4R-drFAekWd4ILZXs70_K2rCmo8GsmcnD19iZG1ERa2eD4pEUetV7a6iaGRq7gKQ-BieIdJ6GcWaz072Fmmp3qEy2A988tlfFOaCQAvjL1NHiw42rPscMvyDzsW4hWisj8fBZUv5OjYCzIS32KCcOBZJ3Rm5PHOIXTlJlDxBTA_HnXpwlv1O_8lWXUlfXSW7DqAc-u5y5ZP9gqUNXZiA0KuT5KKcQ2CL81aR1AfQPB4KchxyzPHjaXBP8hKsGPqnlFEvyqYFiXl4OjvXjQ7HpTto705avnUytYsUKP5RmuWrR3epsL1s5jDtx8XQwYTXVAz6XtU2hlDIUsGM5DK4eh8hVk_v_qEoaX2hT7es4yT5SeVdNwTFXyC8JnqyaulXWykLMxKwL4R8FSWLbXOKqftasEB36XkMcXwyWvvdLogNojYZG1qbIj_n0kGpWWiXorKQGU4QEJj0XtZ7QIa-QLtn4SzlRXbMIroPXCvUNbPU1Cfst1gSdMSzHQwRulv7kMYkIgfEHtfXAgdQi43TSYTzBt_IhZMuLfzBr_2xjNNjQIg71th5BjrqkrbOUKfMEc-g4fcMw0bMgP-ZUng-tUNtzQUz3Q9g9f3K8cZhpIxR2YsEnSPMXPmYph-t_k6AunJOEL97EwokaQv9g4vpH8q3HniBxt4m00?></g></